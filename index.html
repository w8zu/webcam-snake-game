<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹캠 뱀게임</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            background: #222;
            border: 2px solid #4CAF50;
            border-radius: 8px;
            padding: 20px;
        }

        h2 {
            margin-bottom: 15px;
            color: #4CAF50;
        }

        .webcam-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        video {
            width: 100%;
            border: 2px solid #4CAF50;
            border-radius: 8px;
            background: black;
            display: block;
        }

        canvas {
            display: none;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 100px;
            padding: 12px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover:not(:disabled) {
            background: #45a049;
        }

        button:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .status-box {
            background: #333;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.6;
        }

        .status-label {
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 5px;
        }

        .predictions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        .prediction {
            background: #444;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            font-size: 12px;
        }

        .prediction.active {
            background: #4CAF50;
            font-weight: bold;
            color: black;
        }

        #gameCanvas {
            width: 100%;
            max-width: 400px;
            border: 2px solid #4CAF50;
            background: black;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
        }

        .game-info {
            background: #333;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
        }

        .score {
            font-size: 28px;
            font-weight: bold;
            color: #FF9800;
            margin-bottom: 10px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #555;
            font-size: 14px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .game-status {
            margin-top: 15px;
            padding: 12px;
            text-align: center;
            background: #444;
            border-radius: 5px;
            font-weight: bold;
        }

        .game-status.active {
            background: #4CAF50;
            color: black;
        }

        .game-status.gameover {
            background: #f44336;
        }

        .direction-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 5px;
            margin-top: 10px;
        }

        .direction-btn {
            padding: 8px;
            background: #444;
            border: 1px solid #666;
            border-radius: 4px;
            text-align: center;
            font-size: 12px;
        }

        .direction-btn.active {
            background: #4CAF50;
            border-color: #4CAF50;
            font-weight: bold;
            color: black;
        }

        .error-message {
            background: #f44336;
            color: white;
            padding: 12px;
            border-radius: 5px;
            margin-top: 15px;
            display: none;
        }

        .loading {
            color: #FFD700;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="panel">
            <h2>🎥 웹캠 입력</h2>
            <div class="webcam-container">
                <video id="webcam" autoplay playsinline muted></video>
                <canvas id="canvas"></canvas>
            </div>

            <div class="controls">
                <button id="startBtn">웹캠 시작</button>
                <button id="stopBtn" disabled>중지</button>
            </div>

            <div id="error" class="error-message"></div>

            <div class="status-box">
                <div class="status-label">🤖 모델 인식</div>
                <div id="loading" class="loading">모델 로딩 중...</div>
                <div class="predictions" id="predictions" style="display: none;">
                    <div class="prediction">
                        <div>neutral</div>
                        <div id="prob-neutral">0.00</div>
                    </div>
                    <div class="prediction">
                        <div>left</div>
                        <div id="prob-left">0.00</div>
                    </div>
                    <div class="prediction">
                        <div>right</div>
                        <div id="prob-right">0.00</div>
                    </div>
                    <div class="prediction">
                        <div>up</div>
                        <div id="prob-up">0.00</div>
                    </div>
                    <div class="prediction">
                        <div>down</div>
                        <div id="prob-down">0.00</div>
                    </div>
                    <div class="prediction" id="currentPred" style="grid-column: span 2; font-size: 14px;">
                        대기 중...
                    </div>
                </div>
            </div>
        </div>

        <div class="panel">
            <h2>🐍 뱀게임</h2>
            <canvas id="gameCanvas" width="400" height="400"></canvas>

            <div class="game-info">
                <div class="score">점수: <span id="score">0</span></div>

                <div class="info-row">
                    <span>🍎 길이:</span>
                    <span id="length">1</span>
                </div>

                <div class="info-row">
                    <span>➡️ 방향:</span>
                    <span id="direction">정지</span>
                </div>

                <div class="direction-grid">
                    <div id="dir-up" class="direction-btn">↑</div>
                    <div style="background: transparent; border: none;"></div>
                    <div id="dir-down" class="direction-btn">↓</div>
                    <div id="dir-left" class="direction-btn">←</div>
                    <div style="background: transparent; border: none;"></div>
                    <div id="dir-right" class="direction-btn">→</div>
                </div>

                <div class="game-status" id="gameStatus">준비 완료!</div>
            </div>
        </div>
    </div>

    <!-- 라이브러리 로드 순서: TensorFlow 먼저, 그 다음 Teachable Machine -->
    <script async src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0"></script>
    <script async src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5"></script>

    <script>
        // 라이브러리 로드 대기
        function waitForLibraries() {
            return new Promise((resolve) => {
                const checkLibraries = () => {
                    if (window.tmImage && window.tf) {
                        resolve();
                    } else {
                        setTimeout(checkLibraries, 100);
                    }
                };
                checkLibraries();
            });
        }

        // 모든 라이브러리 로드 후 실행
        waitForLibraries().then(initializeApp);

        async function initializeApp() {
            // ===== 게임 설정 =====
            const GRID_SIZE = 20;
            const CANVAS_SIZE = 400;
            const CELL_SIZE = CANVAS_SIZE / GRID_SIZE;
            const GAME_SPEED = 100;

            // ===== 게임 상태 =====
            let snake = [{x: 10, y: 10}];
            let food = {x: 15, y: 15};
            let direction = {x: 0, y: 0};
            let nextDirection = {x: 0, y: 0};
            let score = 0;
            let gameRunning = false;
            let isWebcamRunning = false;
            let lastUpdateTime = 0;

            // ===== 모델 =====
            let model;
            let webcam;

            const URL = 'https://teachablemachine.withgoogle.com/models/CgqgYnQ49/';
            const classNames = ['neutral', 'left', 'right', 'up', 'down'];

            // ===== DOM =====
            const videoEl = document.getElementById('webcam');
            const canvasEl = document.getElementById('canvas');
            const gameCanvas = document.getElementById('gameCanvas');
            const ctx = gameCanvas.getContext('2d');
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            const scoreSpan = document.getElementById('score');
            const lengthSpan = document.getElementById('length');
            const directionSpan = document.getElementById('direction');
            const gameStatusDiv = document.getElementById('gameStatus');
            const currentPredDiv = document.getElementById('currentPred');
            const errorDiv = document.getElementById('error');
            const loadingDiv = document.getElementById('loading');
            const predictionsDiv = document.getElementById('predictions');

            // ===== 모델 로드 =====
            async function loadModel() {
                try {
                    console.log('모델 로딩 시작...');
                    const modelURL = URL + 'model.json';
                    const metadataURL = URL + 'metadata.json';
                    model = await window.tmImage.load(modelURL, metadataURL);
                    console.log('모델 로드 성공');
                    loadingDiv.textContent = '✅ 모델 로드 완료!';
                    loadingDiv.style.color = '#4CAF50';
                    setTimeout(() => {
                        loadingDiv.style.display = 'none';
                        predictionsDiv.style.display = 'grid';
                    }, 1000);
                } catch (error) {
                    console.error('모델 로드 실패:', error);
                    showError('모델 로드 실패: ' + error.message);
                }
            }

            // ===== 웹캠 시작 =====
            async function startWebcam() {
                try {
                    errorDiv.style.display = 'none';
                    console.log('웹캠 시작...');

                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: {width: 400, height: 400},
                        audio: false
                    });

                    videoEl.srcObject = stream;

                    // Teachable Machine 웹캠 생성
                    webcam = new window.tmImage.Webcam(400, 400, true);
                    await webcam.addVideo(videoEl);
                    await webcam.play();

                    isWebcamRunning = true;
                    gameRunning = true;
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    gameStatusDiv.textContent = '🎮 게임 진행 중!';
                    gameStatusDiv.classList.add('active');
                    gameStatusDiv.classList.remove('gameover');

                    resetGame();
                    gameLoop();

                    console.log('웹캠 시작 성공');
                } catch (error) {
                    console.error('웹캠 시작 실패:', error);
                    showError('웹캠 오류: ' + error.message);
                }
            }

            // ===== 웹캠 중지 =====
            function stopWebcam() {
                if (webcam) {
                    webcam.pause();
                }
                if (videoEl.srcObject) {
                    videoEl.srcObject.getTracks().forEach(track => track.stop());
                }
                isWebcamRunning = false;
                gameRunning = false;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                gameStatusDiv.textContent = '⏸️ 중지됨';
                gameStatusDiv.classList.remove('active');
            }

            // ===== 게임 루프 =====
            async function gameLoop() {
                if (!isWebcamRunning) return;

                const now = Date.now();

                if (webcam && model) {
                    webcam.update();
                    await predict();
                }

                if (gameRunning && now - lastUpdateTime > GAME_SPEED) {
                    updateGame();
                    lastUpdateTime = now;
                }

                drawGame();
                requestAnimationFrame(gameLoop);
            }

            // ===== 예측 =====
            async function predict() {
                if (!model) return;

                try {
                    const prediction = await model.predict(webcam.canvas);
                    let maxProb = 0;
                    let maxClass = 0;

                    for (let i = 0; i < classNames.length; i++) {
                        const prob = prediction[i].probability;
                        const probEl = document.getElementById('prob-' + classNames[i]);
                        if (probEl) {
                            probEl.textContent = prob.toFixed(2);
                        }

                        if (prob > maxProb) {
                            maxProb = prob;
                            maxClass = i;
                        }
                    }

                    applyDirection(classNames[maxClass]);
                } catch (error) {
                    console.error('예측 오류:', error);
                }
            }

            // ===== 방향 적용 =====
            function applyDirection(className) {
                document.querySelectorAll('.direction-btn').forEach(el => {
                    el.classList.remove('active');
                });

                currentPredDiv.textContent = className.toUpperCase();

                if (className === 'left' && direction.x === 0) {
                    nextDirection = {x: -1, y: 0};
                    document.getElementById('dir-left').classList.add('active');
                    directionSpan.textContent = '← 왼쪽';
                } else if (className === 'right' && direction.x === 0) {
                    nextDirection = {x: 1, y: 0};
                    document.getElementById('dir-right').classList.add('active');
                    directionSpan.textContent = '→ 오른쪽';
                } else if (className === 'up' && direction.y === 0) {
                    nextDirection = {x: 0, y: -1};
                    document.getElementById('dir-up').classList.add('active');
                    directionSpan.textContent = '↑ 위';
                } else if (className === 'down' && direction.y === 0) {
                    nextDirection = {x: 0, y: 1};
                    document.getElementById('dir-down').classList.add('active');
                    directionSpan.textContent = '↓ 아래';
                } else if (className === 'neutral') {
                    currentPredDiv.textContent = '● 중립';
                }
            }

            // ===== 게임 업데이트 =====
            function updateGame() {
                if (!(nextDirection.x === -direction.x && nextDirection.y === -direction.y)) {
                    direction = nextDirection;
                }

                const head = {
                    x: (snake[0].x + direction.x + GRID_SIZE) % GRID_SIZE,
                    y: (snake[0].y + direction.y + GRID_SIZE) % GRID_SIZE
                };

                if (snake.some(s => s.x === head.x && s.y === head.y)) {
                    endGame();
                    return;
                }

                snake.unshift(head);

                if (head.x === food.x && head.y === food.y) {
                    score += 10;
                    scoreSpan.textContent = score;
                    generateFood();
                } else {
                    snake.pop();
                }

                lengthSpan.textContent = snake.length;
            }

            // ===== 먹이 생성 =====
            function generateFood() {
                food = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };
            }

            // ===== 게임 그리기 =====
            function drawGame() {
                ctx.fillStyle = '#111';
                ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

                ctx.strokeStyle = '#333';
                ctx.lineWidth = 0.5;
                for (let i = 0; i <= GRID_SIZE; i++) {
                    const pos = i * CELL_SIZE;
                    ctx.beginPath();
                    ctx.moveTo(pos, 0);
                    ctx.lineTo(pos, CANVAS_SIZE);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(0, pos);
                    ctx.lineTo(CANVAS_SIZE, pos);
                    ctx.stroke();
                }

                for (let i = 0; i < snake.length; i++) {
                    ctx.fillStyle = i === 0 ? '#4CAF50' : '#45a049';
                    ctx.fillRect(
                        snake[i].x * CELL_SIZE + 1,
                        snake[i].y * CELL_SIZE + 1,
                        CELL_SIZE - 2,
                        CELL_SIZE - 2
                    );
                }

                ctx.fillStyle = '#FF9800';
                ctx.beginPath();
                ctx.arc(
                    food.x * CELL_SIZE + CELL_SIZE / 2,
                    food.y * CELL_SIZE + CELL_SIZE / 2,
                    CELL_SIZE / 2.5,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            }

            // ===== 게임 리셋 =====
            function resetGame() {
                snake = [{x: 10, y: 10}];
                food = {x: 15, y: 15};
                direction = {x: 0, y: 0};
                nextDirection = {x: 0, y: 0};
                score = 0;
                lastUpdateTime = Date.now();
                scoreSpan.textContent = '0';
                lengthSpan.textContent = '1';
                directionSpan.textContent = '정지';
                drawGame();
            }

            // ===== 게임 오버 =====
            function endGame() {
                gameRunning = false;
                gameStatusDiv.textContent = `💀 게임 오버! 점수: ${score}`;
                gameStatusDiv.classList.remove('active');
                gameStatusDiv.classList.add('gameover');
            }

            // ===== 에러 표시 =====
            function showError(message) {
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
            }

            // ===== 이벤트 리스너 =====
            startBtn.addEventListener('click', startWebcam);
            stopBtn.addEventListener('click', stopWebcam);

            // ===== 초기화 =====
            await loadModel();

            window.addEventListener('beforeunload', () => {
                stopWebcam();
            });
        }
    </script>
</body>
</html>
